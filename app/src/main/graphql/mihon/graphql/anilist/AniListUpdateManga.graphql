mutation AniListUpdateManga(
  $library_id: Int!,
  $progress: Int!,
  # SY -->
  $progressVolumes: Int!,
  $repeat: Int!,
  # SY <--
  $status: MediaListStatus!,
  $private: Boolean!,
  $score: Int!,
  $startedAt: FuzzyDateInput!,
  $completedAt: FuzzyDateInput!,
) {
  SaveMediaListEntry(
    id: $library_id,
    progress: $progress,
    # SY -->
    progressVolumes: $progressVolumes,
    repeat: $repeat,
    # SY <--
    status: $status,
    private: $private,
    scoreRaw: $score,
    startedAt: $startedAt,
    completedAt: $completedAt,
  ) {
    id
  }
}
