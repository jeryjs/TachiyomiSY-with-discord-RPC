mutation KitsuAddLibManga(
  $media_id: ID!,
  $status: LibraryEntryStatusEnum!,
  $progress: Int!,
  # SY -->
  $volumesOwned: Int!,
  # SY <--
  $private: Boolean!,
  $rating: Int,
) {
  libraryEntry {
    create(
      input: {
        mediaId: $media_id,
        mediaType: MANGA,
        status: $status,
        progress: $progress,
        # SY -->
        volumesOwned: $volumesOwned,
        # SY <--
        private: $private,
        rating: $rating,
      }
    ) {
      errors {
        message
      }
      libraryEntry {
        id
      }
    }
  }
}
