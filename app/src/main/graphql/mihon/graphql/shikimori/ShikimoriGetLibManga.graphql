query ShikimoriGetLibManga(
  $remote_id: String!,
) {
  mangas(
    ids: $remote_id,
    limit: 1,
  ) {
    id
    url
    name
    chapters
    # SY -->
    volumes
    # SY <--
    userRate {
      id
      chapters
      status
      score
      # SY -->
      volumes
      rewatches
      # SY <--
    }
  }
}
